packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

overrides:
  react-router: 8.3.0

allowBuilds:
  '@anthropic-ai/claude-code': true
  '@parcel/watcher': false
  '@swc/core': true
  core-js: false
  esbuild: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - ultracite@7.10.2

onlyBuiltDependencies:
  - oxlint
